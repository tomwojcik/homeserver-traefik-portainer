version: "3.8"

services:
  gogs:
    restart: always
    # "next" image: runs as git (1000:1000) without s6, has its own healthcheck; PUID/PGID are ignored.
    # The host data dir must be owned by 1000:1000.
    image: gogs/gogs:next-0.14.4
    volumes:
      - /volume1/docker/gogs/data:/data
    container_name: gogs
    security_opt:
      - no-new-privileges:true
    networks:
      - homeserver
    labels:
      - my.zone=homeserver
      - traefik.enable=true
      - traefik.http.routers.gogs.rule=Host(`gogs.${SERVER_DOMAIN}`)
      - traefik.http.routers.gogs.entrypoints=websecure
      - traefik.http.routers.gogs.tls.certresolver=myresolver
      - traefik.http.services.gogs.loadbalancer.server.port=3000
      - traefik.docker.network=homeserver

networks:
  homeserver:
    name: homeserver
    external: true
