version: '3.8'

services:
  # uses sqlite which is fine by me
  # https://docs.n8n.io/hosting/databases/supported-databases-settings/#sqlite

  # potentially todo: add cloudflared with a custom subdomain with a tunnel for webhooks
  n8n:
    image: n8nio/n8n:2.49.5
    restart: always
    # N8N_BASIC_AUTH_* was removed in n8n 1.0 (silently ignored): the owner account is created on
    # first visit, so open the UI right after the first start. The host dir must be owned by 1000:1000.
    environment:
      - N8N_HOST=n8n.${SERVER_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${SERVER_DOMAIN}/
      - N8N_PROXY_HOPS=1                # trust Traefik's X-Forwarded-* (one hop)
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_LOG_OUTPUT=console,file
      - N8N_LOG_LEVEL=info
    volumes:
      - /volume1/docker/n8n/storage:/home/node/
    security_opt:
      - no-new-privileges:true
    networks:
      - homeserver
    labels:
      - my.zone=homeserver
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${SERVER_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=myresolver
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.docker.network=homeserver

networks:
  homeserver:
    name: homeserver
    external: true
