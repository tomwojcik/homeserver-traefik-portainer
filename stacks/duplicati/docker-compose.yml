version: "3.8"

services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:v2.4.1.0_stable_2026-10-29-ls319
    container_name: duplicati
    restart: always
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}   # required since 2.1; a new install stops without it
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI__WEBSERVICE_PASSWORD}   # otherwise the UI password is "changeme"
    volumes:
      - /volume1/docker/duplicati/config:/config
      - /volume1/docker/duplicati/backups:/backups
      - /volume1:/source:ro  # Read-only access to NAS data
    networks:
      - homeserver
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - my.zone=homeserver
      - traefik.enable=true
      - traefik.http.routers.duplicati.rule=Host(`duplicati.${SERVER_DOMAIN}`)
      - traefik.http.routers.duplicati.entrypoints=websecure
      - traefik.http.routers.duplicati.tls.certresolver=myresolver
      - traefik.http.services.duplicati.loadbalancer.server.port=8200
      - traefik.docker.network=homeserver

networks:
  homeserver:
    name: homeserver
    external: true