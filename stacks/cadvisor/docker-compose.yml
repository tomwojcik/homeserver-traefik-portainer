version: "3.8"
services:
  cadvisor:
    # gcr.io/cadvisor is frozen; releases moved to ghcr.io. v0.56.x requires Docker >= 25, v0.57+ negotiates down to DSM's 24.
    image: ghcr.io/google/cadvisor:v0.61.1@sha256:4929b70e82079d001d0028b85d6a4dd25ad4666b719455c9542b983489963916
    container_name: cadvisor
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/cgroup:ro
      - /volume1/@docker:/var/lib/docker:ro
      - /proc:/rootfs/proc:ro
      - /sys:/rootfs/sys:ro
    networks:
      - homeserver
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "65534:65534"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - my.zone=homeserver
      - traefik.enable=true
      - traefik.http.routers.cadvisor.rule=Host(`cadvisor.${SERVER_DOMAIN}`)
      - traefik.http.routers.cadvisor.entrypoints=websecure
      - traefik.http.routers.cadvisor.tls.certresolver=myresolver
      - traefik.http.services.cadvisor.loadbalancer.server.port=8080
      - traefik.docker.network=homeserver

networks:
  homeserver:
    name: homeserver
    external: true