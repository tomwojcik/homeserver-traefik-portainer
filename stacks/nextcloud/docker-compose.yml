version: "3.8"
services:
  nextcloud:
    image: nextcloud:35.0.3-apache
    container_name: nextcloud
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - REDIS_HOST=nextcloud-redis
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=nextcloud-mariadb   # autoconfig only fills the DB settings when all four MYSQL_* are set
      - OVERWRITEPROTOCOL=https
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nextcloud-mariadb
      - nextcloud-redis
    networks:
      - homeserver
    volumes:
      - /volume1/docker/nextcloud/data:/var/www/html
    labels:
      - "my.zone=homeserver"
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${SERVER_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=myresolver"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.docker.network=homeserver"

  nextcloud-mariadb:
    image: mariadb:12.3.3
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    container_name: nextcloud-mariadb
    networks:
      - homeserver
    volumes:
      - /volume1/docker/nextcloud/db:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MARIADB_AUTO_UPGRADE=1   # run mariadb-upgrade on the data dir after an image bump

  nextcloud-redis:
    image: redis:8.12.0-alpine
    restart: always
    container_name: nextcloud-redis
    networks:
      - homeserver
    volumes:
      - /volume1/docker/nextcloud/redis:/data

  # rcdailey/nextcloud-cronjob is archived. The official image's /cron.sh runs cron.php every 5 min as
  # www-data; it needs the network (DB, Redis) and REDIS_HOST, but no docker.sock.
  nextcloud-cron:
    image: nextcloud:35.0.3-apache
    container_name: nextcloud-cron
    entrypoint: /cron.sh
    restart: always
    environment:
      - REDIS_HOST=nextcloud-redis
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nextcloud
    networks:
      - homeserver
    volumes:
      - /volume1/docker/nextcloud/data:/var/www/html

networks:
  homeserver:
    name: homeserver
    external: true
