version: "3.8"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.13.4
    container_name: open-webui
    restart: always
    environment:
      # API Configuration
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Anthropic and other providers: add them as connections in Admin Settings (Open WebUI never read ANTHROPIC_API_KEY).
      - ENABLE_OLLAMA_API=false
      
      # General Configuration
      # Empty WEBUI_SECRET_KEY: start.sh generates one and keeps it in the data dir (the rootfs is read-only).
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - WEBUI_SECRET_KEY_FILE=/app/backend/data/.webui_secret_key
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      
      # Database
      - DATABASE_URL=sqlite:///data/webui.db
      
      # Security & Privacy
      - WEBUI_NAME=Private AI Chat
      - WEBUI_URL=https://chat.${SERVER_DOMAIN}
      - CORS_ALLOW_ORIGIN=https://chat.${SERVER_DOMAIN}
    volumes:
      - /volume1/docker/open-webui/data:/app/backend/data
    networks:
      - homeserver
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      # The app rewrites its static dir at start; only the /docs page's swagger-ui assets go missing.
      - /app/backend/open_webui/static:uid=1000,gid=1000
    user: "1000:1000"
    deploy:
      resources:
        limits:
          memory: 2G                     # the full image loads a local embedding model
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]   # the image has no wget
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - my.zone=homeserver
      - traefik.enable=true
      - traefik.http.routers.open-webui.rule=Host(`chat.${SERVER_DOMAIN}`)
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls.certresolver=myresolver
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
      - traefik.docker.network=homeserver

networks:
  homeserver:
    name: homeserver
    external: true